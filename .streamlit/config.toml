[theme]
# Light is the default look. (The in-app "Dark appearance" switch restyles most things on top of this.)
base = "light"
primaryColor = "#5841B6"
backgroundColor = "#F6F3FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#211B36"
greenColor = "#5841B6"
greenBackgroundColor = "#EDE6FC"
greenTextColor = "#493492"
font = "sans serif"

[server]
headless = true
